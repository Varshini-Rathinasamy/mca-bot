<!DOCTYPE html>
<html>
<head>
    <title>MCA Chatbot</title>
    <style>
        body {
            font-family: Arial;
            background: #e5ddd5;
        }
        .chatbox {
            width: 400px;
            margin: 30px auto;
            background: white;
            padding: 15px;
            border-radius: 10px;
            height: 500px;
            overflow-y: scroll;
        }
        .user {
            text-align: right;
            background: #dcf8c6;
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
        }
        .bot {
            text-align: left;
            background: #f1f0f0;
            padding: 8px;
            margin: 5px;
            border-radius: 10px;
        }
        form {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="chatbox">
    <h2>MCA Chatbot 💬</h2>

    {% for msg in chat_history %}
        {% if msg.role == "user" %}
            <div class="user">{{msg.content}}</div>
        {% else %}
            <div class="bot">{{msg.content}}</div>
        {% endif %}
    {% endfor %}
</div>

<form method="post">
    <input type="text" name="user_input" placeholder="Type message..." required>
    <input type="submit" value="Send">
</form>

</body>
</html>
